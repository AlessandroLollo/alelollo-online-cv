name: Verify résumé explorer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: webapp-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.7'
          bundler: '2.3.19'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and serve the GitHub Pages site
        run: |
          bundle exec jekyll build
          bundle exec jekyll serve --host 127.0.0.1 > /tmp/jekyll.log 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4000/alelollo-online-cv/ > /dev/null
      - run: npm test
      - name: Startup diagnostics
        if: failure()
        run: cat /tmp/jekyll.log || true
