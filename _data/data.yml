experiences:
  title: Experiences
  info:
    - role: Senior Data Engineer
      time: 2025 - Present
      company: LocalStack
      link: "https://localstack.cloud"
      details: |
        TODO


    - role: Data Engineering Manager
      time: 2020 - 2024
      company: Cloud Academy
      link: "https://cloudacademy.com/"
      details: |
        Led the creation, growth, and mentoring of the Data Engineering & Analytics team,
        driving initiatives that transformed how data was used to support business decisions and enterprise customers analytics requirements.

        Designed, implemented, and evolved the Data Engineering infrastructure to ingest, process,
        and transform data from multiple sources, ensuring timely and accurate data delivery
        to internal stakeholders and enterprise customers.

        Championed best practices across the data platform, including:
        - Data Lake & Data Warehouse design and implementation
        - Data modeling and pipeline development based on software engineering principles
        - Integration of Data Quality monitoring as a core platform component
        - Dashboard and reporting design and deployment
        - Analytics solutions for internal and external stakeholders

        Led strategic initiatives to build and scale the team and capabilities:
        - Hiring, training, and mentoring Data Engineers and Data Analysts
        - Defining career ladders and professional development paths
        - Managing data requirements from internal stakeholders and enterprise clients
        - Selecting vendors, solutions, and tools to deliver high-impact analytics solutions
        - Training internal stakeholders on effective use of the BI platform

        Partnered with Engineering, Product, and Content teams to define metrics that measure product feature usage
        and content engagement:
        - Led collection of business requirements and selection of appropriate data sources to build a single source of truth
        - Defined, validated, and tracked KPIs

        Through these initiatives, drove a culture of data excellence, quality, and actionable insights across the organization.

    - role: Data Governance Manager
      time: 2018 - 2020
      company: Cuebiq
      link: "https://www.cuebiq.com/"
      details: |
        Founded and led the Data Quality Team, partnering with Product Data Owners to define, implement, and monitor Data Quality indicators.  

        Enabled Product teams to gain actionable insights and effectively manage the quality of multiple data products.

        Directed the technical implementation and deployment of key solutions, including:
        - Data Catalog solution Adopted by 150+ users to efficiently discover dataset information and metadata essential for their work.
        - Corporate Data Warehouse as the single source of truth for certified, high-quality, and trusted data,
        supporting analysis, reporting, and company performance monitoring.

        Through these initiatives, strengthened data governance, improved data reliability,
        and empowered teams to make data-driven decisions with confidence.

    - role: Chief Data Officer
      time: 2017 - 2018
      company: Linear Assicurazioni
      link: "https://www.linear.it/"
      details: |
        Led the Data Center & BI Team in developing and maintaining analytics solutions to monitor company performance,
        with a focus on revenue from car and life insurance products.
        
        Partnered with the Head of IT, General Manager, and senior management to define and implement the long-term data strategy,
        ensuring analytics initiatives aligned with business goals and
        supported data-driven decision-making across the organization.

    - role: Senior Solution Designer & Analyst
      time: 2013 - 2017
      company: ICONSULTING
      link: "https://www.iconsulting.biz/"
      details: |
        Led the design, implementation, and optimization of Business Analytics solutions for a diverse client base,
        including multinational holdings, banks, B2C and B2B companies, and fashion brands.

        Focused on the technical delivery of projects, including ETL and BI solution design,
        development team management, and ensuring high-quality implementation. Partnered with clients on business-facing activities such as
        functional analysis, requirements definition, and user acceptance testing (UAT).

        Delivered regular technical training sessions for team members and clients,
        fostering knowledge transfer, skill development, and adoption of best practices.

    - role: Other roles
      time: 2010 - 2013
      company: CINECA, CSP S.p.a.

