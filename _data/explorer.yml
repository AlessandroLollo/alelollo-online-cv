projects:
  - id: trusted-data
    title: A shared foundation for trusted data
    experienceId: cuebiq
    focus: Governance
    views: [engineering, leadership, business-impact]
    problem: Teams needed to discover datasets, understand their quality, and work from trusted information.
    decision: Establish shared data quality indicators with Product Data Owners, alongside a catalog and corporate warehouse.
    delivery: Founded the Data Quality Team and directed the technical implementation and deployment of the catalog and warehouse.
    outcome: The catalog was adopted by 150+ users; the warehouse supported analysis, reporting, and company performance monitoring.
  - id: analytics-capability
    title: Building a data capability, not just a platform
    experienceId: cloud-academy
    focus: Leadership
    views: [engineering, leadership, business-impact]
    problem: Internal stakeholders and enterprise customers needed reliable analytics from multiple data sources.
    decision: Develop the engineering and analytics team alongside a data lake, warehouse, and shared business metrics.
    delivery: Hired and mentored engineers and analysts, developed career frameworks, evolved the infrastructure, and trained stakeholders on BI adoption.
    outcome: Enabled stakeholder and customer analytics, unified data sources, and established KPI tracking for product usage and content engagement.
  - id: ingestion-platform
    title: Evolving real-time ingestion
    experienceId: localstack
    focus: Platform engineering
    views: [engineering, business-impact]
    problem: Large-scale ingestion needed reliable and efficient data flow, while internal stakeholders needed analytics tools.
    decision: Maintain and enhance ingestion solutions while assessing tools and vendors for a new data platform.
    delivery: Contributed to pipelines and reporting tools, supported product engineering, and resolved critical issues.
    outcome: Supported the evolution of ingestion and internal analytics, and led vendor and tool selection for a new platform.

